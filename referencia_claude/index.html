<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XSODOMA - Vídeos Adultos Grátis</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Cabeçalho -->
    <header class="header">
        <div class="header-top">
            <div class="logo">
                <svg width="40" height="40" viewBox="0 0 40 40">
                    <circle cx="20" cy="20" r="18" fill="#e63946"/>
                    <text x="20" y="28" text-anchor="middle" fill="white" font-size="24" font-weight="bold">X</text>
                </svg>
                <span>XSODOMA</span>
            </div>

            <div class="search-container">
                <input
                    type="text"
                    id="searchInput"
                    class="search-input"
                    placeholder="Buscar vídeos..."
                    role="combobox"
                    aria-autocomplete="list"
                    aria-expanded="false"
                    aria-controls="suggestions-list"
                >
                <button id="searchBtn" class="search-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.35-4.35"></path>
                    </svg>
                </button>
                <ul id="suggestions-list" class="suggestions-list" role="listbox"></ul>
            </div>
        </div>

        <nav class="nav">
            <button class="nav-item active" data-filter="all">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                </svg>
                Início
            </button>
            <button class="nav-item" data-filter="hd">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="2" y="7" width="20" height="15" rx="2" ry="2"></rect>
                    <polyline points="17 2 12 7 7 2"></polyline>
                </svg>
                HD
            </button>
            <button class="nav-item" data-filter="new">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polyline points="12 6 12 12 16 14"></polyline>
                </svg>
                Novos
            </button>
            <button class="nav-item" id="categoriesBtn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
                Categorias
            </button>
        </nav>
    </header>

    <!-- Gaveta de Categorias -->
    <div id="categoriesDrawer" class="categories-drawer">
        <div class="drawer-header">
            <h2>Categorias</h2>
            <button id="closeDrawer" class="close-drawer">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>
        <div id="categoriesContent" class="categories-content"></div>
    </div>
    <div id="drawerOverlay" class="drawer-overlay"></div>

    <!-- Anúncio Topo -->
    <div class="ad-container ad-top">
        <span class="ad-label">Publicidade</span>
        <div id="ad-top" class="ad-slot"></div>
    </div>

    <!-- Filtros -->
    <div class="filters">
        <select id="sortBy" class="filter-select">
            <option value="top-rated">Mais Votados</option>
            <option value="most-recent">Mais Recentes</option>
            <option value="longest">Mais Longos</option>
            <option value="shortest">Mais Curtos</option>
        </select>

        <select id="perPage" class="filter-select">
            <option value="30">30 por página</option>
            <option value="60">60 por página</option>
            <option value="90">90 por página</option>
        </select>

        <select id="thumbSize" class="filter-select">
            <option value="medium">Capa Média</option>
            <option value="small">Capa Pequena</option>
            <option value="big">Capa Grande</option>
        </select>
    </div>

    <!-- Grade de Vídeos -->
    <main class="container">
        <div id="videoGrid" class="video-grid"></div>

        <!-- Anúncio no meio da grade -->
        <div class="ad-container ad-inline">
            <span class="ad-label">Publicidade</span>
            <div id="ad-inline" class="ad-slot"></div>
        </div>

        <div id="loading" class="loading">Carregando...</div>
        <div id="error" class="error"></div>

        <!-- Paginação -->
        <div id="pagination" class="pagination"></div>
    </main>

    <!-- Modal do Vídeo -->
    <div id="videoModal" class="modal">
        <div class="modal-content">
            <button id="closeModal" class="close-modal">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>

            <div id="videoPlayer" class="video-player"></div>

            <!-- Anúncio abaixo do player -->
            <div class="ad-container ad-player">
                <span class="ad-label">Publicidade</span>
                <div id="ad-player" class="ad-slot"></div>
            </div>

            <div id="videoInfo" class="video-info"></div>

            <h3>Vídeos Relacionados</h3>
            <div id="relatedVideos" class="related-videos"></div>
        </div>
    </div>

    <!-- Rodapé -->
    <footer class="footer">
        <p>&copy; 2024 XSODOMA. Todos os direitos reservados.</p>
        <p>Este site contém conteúdo adulto. Você deve ter 18+ anos para acessar.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
